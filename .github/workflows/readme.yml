# README structure check — gjcourt/.github README-STANDARD.md.
name: README
on:
  # No paths filter: `readme / readme` is a required check, so it must run on every PR.
  pull_request:
  push:
    branches: [main, master]
    paths: [README.md, .github/workflows/readme.yml]

permissions:
  contents: read

jobs:
  readme:
    uses: gjcourt/.github/.github/workflows/readme-check.yml@main
